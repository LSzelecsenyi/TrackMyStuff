name: Deploy backend (PROD) to OCI

on:
  push:
    branches: ["prod"]
  workflow_dispatch:

concurrency:
  group: strict-backend-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://api.strictworkout.eu

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle.kts
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Test and build backend jar
        run: |
          set -euo pipefail
          cd backend
          chmod +x ./gradlew
          ./gradlew test bootJar --no-daemon
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected one boot jar, found ${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          cp "${jars[0]}" /tmp/strict-backend.jar

      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || (echo "DEPLOY_SSH_KEY is empty" && exit 1)
          test -n "${{ secrets.DEPLOY_HOST }}" || (echo "DEPLOY_HOST is empty" && exit 1)
          test -n "${{ secrets.DEPLOY_USER }}" || (echo "DEPLOY_USER is empty" && exit 1)
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload jar
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p /opt/strict/prod"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            /tmp/strict-backend.jar \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/strict/prod/strict-backend.jar.next"

      - name: Restart service
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail; cd /opt/strict/prod; test -f strict-backend.jar.next; if [ -f strict-backend.jar ]; then cp -a strict-backend.jar strict-backend.jar.prev; fi; mv strict-backend.jar.next strict-backend.jar; sudo systemctl restart strict-backend-prod; sudo systemctl status strict-backend-prod --no-pager -l"

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -euo pipefail
            echo "Waiting for Strict PROD backend on 127.0.0.1:8082/api/v1/health"
            for i in $(seq 1 60); do
              code=$(curl -sS -o /tmp/strict-prod-health.json -w "%{http_code}" http://127.0.0.1:8082/api/v1/health || true)
              if [ "$code" = "200" ] && grep -q "\"UP\"" /tmp/strict-prod-health.json; then
                echo "Strict PROD backend is UP"
                exit 0
              fi
              sleep 2
            done
            echo "Strict PROD backend did not become healthy" >&2
            sudo systemctl status strict-backend-prod --no-pager -l || true
            sudo journalctl -u strict-backend-prod -n 200 --no-pager || true
            exit 1
          '
