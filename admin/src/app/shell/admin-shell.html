<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/founders">
      <img class="brand-mark" src="strict-wordmark-dark.png" alt="Strict" />
      <span class="admin-label">Admin</span>
    </a>
    <nav aria-label="Admin">
      <a routerLink="/founders" routerLinkActive="active">Founder applications</a>
    </nav>
    <div class="topbar-actions">
      <button type="button" class="button" (click)="theme.cycle()" [attr.aria-label]="theme.cycleLabel()">
        {{ theme.label() }}
      </button>
      <button
        type="button"
        class="button"
        (click)="toggleAccount()"
        [attr.aria-expanded]="accountOpen()"
        aria-controls="admin-account"
      >
        Account
      </button>
    </div>
  </header>
  @if (accountOpen()) {
    <section id="admin-account" class="account" aria-label="Account">
      <p class="account-status">{{ auth.account()?.email || 'Signed in' }}</p>
      <button type="button" class="button" (click)="logout()">Log out</button>
      @if (auth.errorMessage(); as message) {
        <p role="alert">{{ message }}</p>
      }
    </section>
  }
  <main id="main">
    <router-outlet />
  </main>
</div>
