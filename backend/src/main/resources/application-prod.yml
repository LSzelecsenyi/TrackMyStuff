spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

strict:
  google:
    client-id: ${STRICT_GOOGLE_CLIENT_ID}
  admin:
    cookie-secure: true
  founder:
    rules: production
  billing:
    package-name: ${STRICT_PLAY_PACKAGE_NAME:com.strictworkout.app}
    product-ids: ${STRICT_BILLING_PRODUCT_IDS:}
    service-account-file: ${STRICT_PLAY_SERVICE_ACCOUNT_FILE:}
    rtdn-audience: ${STRICT_PLAY_RTDN_AUDIENCE:}
    rtdn-service-account: ${STRICT_PLAY_RTDN_SERVICE_ACCOUNT:}
