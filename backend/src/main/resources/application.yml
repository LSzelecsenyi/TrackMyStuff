spring:
  application:
    name: strict-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/strict
    username: strict
    password: strict
    hikari:
      connection-init-sql: "SET TIME ZONE 'UTC'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP_WITH_TIMEZONE
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  mvc:
    throw-exception-if-no-handler-found: true
    problemdetails:
      enabled: false
  web:
    resources:
      add-mappings: false

server:
  port: 8082
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

strict:
  google:
    client-id: ${STRICT_GOOGLE_CLIENT_ID:}
  founder:
    rules: ${STRICT_FOUNDER_RULES:production}
  billing:
    package-name: ${STRICT_PLAY_PACKAGE_NAME:com.strictworkout.app}
    product-ids: ${STRICT_BILLING_PRODUCT_IDS:}
    service-account-file: ${STRICT_PLAY_SERVICE_ACCOUNT_FILE:}
    rtdn-audience: ${STRICT_PLAY_RTDN_AUDIENCE:}
    rtdn-service-account: ${STRICT_PLAY_RTDN_SERVICE_ACCOUNT:}
  auth:
    session-lifetime: ${STRICT_AUTH_SESSION_LIFETIME:30d}
  admin:
    session-lifetime: ${STRICT_ADMIN_SESSION_LIFETIME:12h}
    google-subjects: ${STRICT_ADMIN_GOOGLE_SUBJECTS:}
    cookie-secure: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z',UTC} %-5level [%thread] %logger{40} - %msg%n"
