# Repository template. Install later as /etc/nginx/conf.d/strict-admin.conf.
# The host web server is 1.20, so http2 stays on the listen directive.
# Neither server uses the catch-all listen flag. Port 80 names this host
# explicitly so an unknown-host port-80 proxy cannot receive it.
# The browser stays on admin.strictworkout.eu. /api/ is proxied on that
# same host, so the admin session cookie and CSRF cookie stay host-only.
# Do not rewrite Set-Cookie Domain or Path.

server {
    listen 80;
    listen [::]:80;
    server_name admin.strictworkout.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.strictworkout.eu;

    ssl_certificate     /etc/strict/tls/certificate.pem;
    ssl_certificate_key /etc/strict/tls/privatekey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 2m;

    root /opt/strict/prod/admin/current;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~* \.(?:css|js|mjs|svg|png|webp|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
