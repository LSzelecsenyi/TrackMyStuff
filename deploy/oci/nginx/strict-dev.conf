# Additive nginx site for Strict DEV admin.
# Install as /etc/nginx/conf.d/strict-dev.conf.
# The DEV API is not served here. Cloudflare Tunnel sends it to 127.0.0.1:8083.
# Do not edit PUFF server blocks.

server {
    listen 80;
    server_name admin-dev.strictworkout.eu;

    root /opt/strict/dev/admin-ui;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
