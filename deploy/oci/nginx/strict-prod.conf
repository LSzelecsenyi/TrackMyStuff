# Additive nginx site for Strict PROD.
# Install as /etc/nginx/conf.d/strict-prod.conf after the origin certificate exists.
# Do not edit PUFF server blocks. Do not point ssl_certificate at /etc/puff/tls.

server {
    listen 80;
    server_name admin.strictworkout.eu;

    root /opt/strict/prod/admin-ui;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name admin.strictworkout.eu;

    ssl_certificate /etc/strict/tls/origin.pem;
    ssl_certificate_key /etc/strict/tls/origin.key;

    root /opt/strict/prod/admin-ui;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.strictworkout.eu;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
